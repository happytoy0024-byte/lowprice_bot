name: Daily Lowprice Bot

on:
  schedule:
    # 매일 한국 시간 09:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run_bot:
    name: Run Lowprice Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create .env from GitHub Secrets
        run: |
          echo "KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY || secrets.kakao_REST_API_key }}" >> .env
          echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET || secrets.kakao_CLIENT_SECRET }}" >> .env
          echo "KAKAO_REFRESH_TOKEN=${{ secrets.KAKAO_REFRESH_TOKEN || secrets.kakao_REFRESH_TOKEN }}" >> .env

      - name: Run bot
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY || secrets.kakao_REST_API_key }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET || secrets.kakao_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN || secrets.kakao_REFRESH_TOKEN }}
        run: python lowprice_bot.py
